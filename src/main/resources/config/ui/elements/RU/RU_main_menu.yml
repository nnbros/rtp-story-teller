mainMenu:
    - id: "charBaseInfo"
      text: "${charName} [${accountLevel}]\nКласс: ${charClass} [${charClassLevel}]\nВойска: ${charArmy}"
    - id: "main"
      message:
          action: CREATE
          text: "${charBaseInfo}\n\nВы находитесь в Лагере."
          replyKeyboard:
              replyKeyboardMarkup:
                  resizeKeyboard: true
                  rows:
                      - keyboardRow:
                            - keyboardButton:
                                  text: "Охота на монстров"
                            - keyboardButton:
                                  text: "🚧Арена"
                      - keyboardRow:
                            - keyboardButton:
                                  text: "Персонаж"
                            - keyboardButton:
                                  text: "🚧Армия"
                      - keyboardRow:
                            - keyboardButton:
                                  text: "🚧Привал"
                            - keyboardButton:
                                  text: "🚧Карта"
                      - keyboardRow:
                            - keyboardButton:
                                  text: "🚧Параметры"
    - id: "character"
      message:
          action: CREATE
          text: "${charBaseInfo}"
          replyKeyboard:
              replyKeyboardMarkup:
                  resizeKeyboard: true
                  rows:
                      - keyboardRow:
                            - keyboardButton:
                                  text: "Характеристики"
                            - keyboardButton:
                                  text: "Умения"
                      - keyboardRow:
                            - keyboardButton:
                                  text: "🚧Класс"
                            - keyboardButton:
                                  text: "🚧Экипировка"
                      - keyboardRow:
                            - keyboardButton:
                                  text: "Назад"
    - id: "class"
      message:
          action: CREATE
          text: "${name} [${accountLevel}]\n Класс: ${charClass} [${charClassLevel}]\n${charClassDescription}\nВыберите класс:"
          replyKeyboard:
              inlineKeyboard:
                  dynamicRows:
                      id: classes
                      maxButtonsPerRow: 1
                  rows:
                      - inlineKeyboardRow:
                            - inlineKeyboardButton:
                                  text: "Назад"
                                  callbackData: "storyteller_character"
