spring:
    main:
        allow-bean-definition-overriding: true
    liquibase:
        enabled: false
    datasource:
        url: jdbc:h2:mem:test
    jpa:
        hibernate:
            ddl-auto: none
        properties.hibernate.dialect: org.hibernate.dialect.H2Dialect
        show-sql: true
    cloud.openfeign.client.config:
        default:
            loggerLevel: none
        gateway:
            url: "http://localhost"
            path: "/test"
    config:
        import: "classpath:/config/include.yml"
    autoconfigure.exclude:
    - org.springframework.cloud.openfeign.FeignAutoConfiguration

storyteller:
    action-processor-thread-pool:
        min: 5
        max: 10
        queue: 100
        thread-name-prefix: ActionPipeline-
    api:
        base-url: "/api/v1"
        actions-endpoint-prefix: "/actions"
        cache-endpoint-prefix: "/cache"